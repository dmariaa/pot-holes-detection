run_name: london-contrastive-cnn
epochs: 100
learning_rate: 0.001
patience: 30

model:
  architecture: cnn
  channels:
    - all
  embedding_dim: 256
  base_channels: 32
  dropout: 0.2
  projection_hidden_dim: 256
  projection_dim: 128

contrastive:
  classes_per_batch: 4
  samples_per_class: 4
  val_batches: 100
  temperature: 0.1
  seed: 42
#  augmentations:
#    amplitude_scale: 0.1
#    noise_std: 0.02
#    channel_dropout: 0.1
#    freq_mask_fraction: 0.1
#    time_mask_fraction: 0.1

data:
  version: 2
  data_folder: dataset
  generate: false
  window_size: 20
  step: 1
  verbose: true

split:
  strategy: session
  shuffle: false
  train_sessions:
    - session_STBPRO1@824C26_20260210_122839
    - session_STBPRO1@824C26_20260210_141443
    - session_STBPRO1@824C26_20260210_151550
    - session_STBPRO3@71E957_20260210_122725
    - session_STBPRO3@71E957_20260210_141443
    - session_STBPRO3@71E957_20260210_151552
  val_sessions:
    - session_STBPRO1@824C26_20260211_094115
  test_sessions:
    - session_STBPRO3@71E957_20260211_094114

wandb:
  enabled: true
  project: contrastive-pretraining
  entity: potholes-team
  mode: online
  tags:
    - contrastive
    - cnn
    - session-split
  log_split_artifact: true
  log_model_artifact: true
  log_batch_interval: 25
