run_name: contrastive-ws4-step1-cnn
batch_size: 8
epochs: 100
learning_rate: 0.001
patience: 30

model:
  architecture: cnn
  channels:
    - all
  embedding_dim: 256
  base_channels: 32
  num_blocks: 2
  dropout: 0.2
  projection_hidden_dim: 256
  projection_dim: 128

contrastive:
  classes_per_batch: 4
  samples_per_class: 4
  val_batches: 100
  temperature: 0.1
  seed: 42

data:
  version: 2
  data_folder: dataset/ws_4-step_1
  generate: false
  window_size: 4
  step: 1
  resize: false
  normalize: false
  verbose: true

split:
  strategy: session
  shuffle: false
  train_sessions:
    - session_STBPRO1@824C26_20260210_122839
    - session_STBPRO1@824C26_20260210_141443
    - session_STBPRO1@824C26_20260210_151550
    - session_STBPRO3@71E957_20260210_122725
    - session_STBPRO3@71E957_20260210_141443
    - session_STBPRO3@71E957_20260210_151552
  val_sessions:
    - session_STBPRO1@824C26_20260211_094115
  test_sessions:
    - session_STBPRO3@71E957_20260211_094114

wandb:
  enabled: true
  project: contrastive-pretraining
  entity: potholes-team
  mode: online
  tags:
    - contrastive
    - cnn
    - ws4
    - step1
    - session-split
  log_split_artifact: true
  log_training_artifact: true
  log_model_artifact: true
  log_dataset_artifact: false
  log_batch_metrics: true
  log_batch_interval: 25
